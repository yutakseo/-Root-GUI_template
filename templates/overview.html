<div class="editor-tab">overview.png <span>INSPECTION OVERLAY</span></div>
<div class="inspection-layout">
  <div class="viewport overview-viewport">
    <img src="{overview_src}" alt="Inspection overview">
  </div>
  <aside class="point-details" aria-label="P1, P2, P3 detail views">
    
    <div class="detail-card p1">
      <div class="detail-header"><b>P1</b><span>AREA 01</span></div>
      <div class="detail-crop"><img src="{p1_src}" alt="P1 detail"></div>
    </div>

    <div class="detail-card p2">
      <div class="detail-header"><b>P2</b><span>AREA 02</span></div>
      <div class="detail-crop"><img src="{p2_src}" alt="P2 detail"></div>
    </div>

    <div class="detail-card p3">
      <div class="detail-header"><b>P3</b><span>AREA 03</span></div>
      <div class="detail-crop"><img src="{p3_src}" alt="P3 detail"></div>
    </div>
    
  </aside>
</div>
